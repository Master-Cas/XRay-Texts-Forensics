[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-texts-forensics"
version = "0.1.0"
description = "Evidence-driven text forensics platform for watermark, linguistic, provenance, and AI-text auditing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4,<4",
    "pydantic>=2.9,<3",
    "pypdf>=5,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
xray = "xray_text_forensics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xray_text_forensics"]
