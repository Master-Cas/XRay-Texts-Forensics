[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-texts-forensics"
version = "0.12.0"
description = "Evidence-driven text forensics platform for watermark, linguistic, provenance, and AI-text auditing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4,<4",
    "fastapi>=0.115,<0.116",
    "numpy>=2.0,<3",
    "pydantic>=2.9,<3",
    "pypdf>=5,<7",
    "reportlab>=4.2,<5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "click>=8.1,<8.2",
    "python-multipart>=0.0.12,<0.1",
    "typer>=0.16,<0.17",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.3,<6",
]
packaging = [
    "pyinstaller>=6.10,<7",
]
dev = [
    "httpx>=0.27,<0.28",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
xray = "xray_text_forensics.cli:app"
xray-web = "xray_text_forensics.web.run:main"
xray-desktop = "xray_text_forensics.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xray_text_forensics"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true


[tool.setuptools.package-data]
"xray_text_forensics.web" = ["static/*.html", "static/*.css", "static/*.js"]
