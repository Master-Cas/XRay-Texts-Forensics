name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_desktop.py"
      - "tests/test_web_api.py"
      - "tests/test_web_ui.py"
      - "tests/test_production_readiness.py"
      - "tests/test_runtime_paths.py"
      - "tests/test_windows_installer_config.py"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop,packaging]"

      - name: Probe Authenticode tooling
        shell: pwsh
        run: |
          ./packaging/windows/sign-authenticode.ps1 -ProbeOnly

      - name: Windows-focused tests
        run: |
          python -m pytest tests/test_desktop.py tests/test_web_api.py tests/test_web_ui.py tests/test_production_readiness.py tests/test_runtime_paths.py tests/test_windows_installer_config.py tests/test_signing_config.py

      - name: Build desktop bundle
        run: |
          pyinstaller packaging/windows/xray-desktop.spec --noconfirm --clean

      - name: Prepare Authenticode credentials
        id: signing
        shell: pwsh
        env:
          XRAY_SIGNING_PFX_B64: ${{ secrets.XRAY_SIGNING_PFX_B64 }}
          XRAY_SIGNING_PFX_PASSWORD: ${{ secrets.XRAY_SIGNING_PFX_PASSWORD }}
          XRAY_SIGNING_TIMESTAMP_URL: ${{ secrets.XRAY_SIGNING_TIMESTAMP_URL }}
        run: |
          $values = @(
            $env:XRAY_SIGNING_PFX_B64,
            $env:XRAY_SIGNING_PFX_PASSWORD,
            $env:XRAY_SIGNING_TIMESTAMP_URL
          )
          $configured = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configured -ne 0 -and $configured -ne 3) {
            throw "Authenticode secrets are partially configured; expected all three or none"
          }

          $enabled = $configured -eq 3
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            $pfx = Join-Path $env:RUNNER_TEMP "xray-signing.pfx"
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:XRAY_SIGNING_PFX_B64)
            )
            "pfx_path=$pfx" >> $env:GITHUB_OUTPUT
          }

      - name: Sign portable executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          XRAY_SIGNING_PFX_PASSWORD: ${{ secrets.XRAY_SIGNING_PFX_PASSWORD }}
          XRAY_SIGNING_TIMESTAMP_URL: ${{ secrets.XRAY_SIGNING_TIMESTAMP_URL }}
        run: |
          ./packaging/windows/sign-authenticode.ps1 `
            -FilePath "dist/XRay-Texts-Forensics/XRay-Texts-Forensics.exe" `
            -PfxPath "${{ steps.signing.outputs.pfx_path }}" `
            -PfxPassword $env:XRAY_SIGNING_PFX_PASSWORD `
            -TimestampUrl $env:XRAY_SIGNING_TIMESTAMP_URL

      - name: Record portable signing status
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            "SIGNED_AUTHENTICODE" | Set-Content "dist/XRay-Texts-Forensics/SIGNING-STATUS.txt"
          } else {
            "UNSIGNED_ALPHA" | Set-Content "dist/XRay-Texts-Forensics/SIGNING-STATUS.txt"
          }

      - name: Verify portable executable and checksum
        shell: pwsh
        run: |
          $exe = "dist/XRay-Texts-Forensics/XRay-Texts-Forensics.exe"
          if (-not (Test-Path $exe)) {
            throw "Desktop executable was not produced"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  XRay-Texts-Forensics.exe" | Set-Content "dist/XRay-Texts-Forensics/SHA256SUMS.txt"
          Get-Item $exe | Format-List Name,Length,FullName
          Get-Content "dist/XRay-Texts-Forensics/SHA256SUMS.txt"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $source = (Resolve-Path "dist/XRay-Texts-Forensics").Path
          $output = Join-Path $PWD "dist-installer"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }
          & $iscc "packaging/windows/installer.iss" "/DMyAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          XRAY_SIGNING_PFX_PASSWORD: ${{ secrets.XRAY_SIGNING_PFX_PASSWORD }}
          XRAY_SIGNING_TIMESTAMP_URL: ${{ secrets.XRAY_SIGNING_TIMESTAMP_URL }}
        run: |
          ./packaging/windows/sign-authenticode.ps1 `
            -FilePath "dist-installer/XRay-Texts-Forensics-Windows-Setup.exe" `
            -PfxPath "${{ steps.signing.outputs.pfx_path }}" `
            -PfxPassword $env:XRAY_SIGNING_PFX_PASSWORD `
            -TimestampUrl $env:XRAY_SIGNING_TIMESTAMP_URL

      - name: Record installer signing status
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            "SIGNED_AUTHENTICODE" | Set-Content "dist-installer/SIGNING-STATUS.txt"
          } else {
            "UNSIGNED_ALPHA" | Set-Content "dist-installer/SIGNING-STATUS.txt"
          }

      - name: Smoke install and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist-installer/XRay-Texts-Forensics-Windows-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "XRayInstall"
          $dataDir = Join-Path $env:LOCALAPPDATA "XRay Texts Forensics"
          $marker = Join-Path $dataDir "installer-data-retention-marker.txt"

          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          "preserve-me" | Set-Content $marker

          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }

          $installedExe = Join-Path $installDir "XRay-Texts-Forensics.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable is missing"
          }

          $uninstaller = Get-ChildItem -Path $installDir -Filter "unins*.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "Uninstaller was not created"
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }

          if (Test-Path $installedExe) {
            throw "Installed executable remains after uninstall"
          }
          if (-not (Test-Path $marker)) {
            throw "User forensic data was deleted by uninstall"
          }

          Remove-Item -Path $dataDir -Recurse -Force

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = "dist-installer/XRay-Texts-Forensics-Windows-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not produced"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          "$hash  XRay-Texts-Forensics-Windows-Setup.exe" | Set-Content "dist-installer/SHA256SUMS.txt"
          Get-Item $installer | Format-List Name,Length,FullName
          Get-Content "dist-installer/SHA256SUMS.txt"
          Get-Content "dist-installer/SIGNING-STATUS.txt"

      - name: Remove temporary signing material
        if: always() && steps.signing.outputs.pfx_path != ''
        shell: pwsh
        run: |
          Remove-Item -Path "${{ steps.signing.outputs.pfx_path }}" -Force -ErrorAction SilentlyContinue

      - name: Upload Windows portable alpha
        uses: actions/upload-artifact@v4
        with:
          name: XRay-Texts-Forensics-Windows-alpha
          path: dist/XRay-Texts-Forensics/
          if-no-files-found: error

      - name: Upload Windows installer alpha
        uses: actions/upload-artifact@v4
        with:
          name: XRay-Texts-Forensics-Windows-Installer-alpha
          path: dist-installer/
          if-no-files-found: error
