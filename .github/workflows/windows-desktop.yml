name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_desktop.py"
      - "tests/test_web_api.py"
      - "tests/test_web_ui.py"
      - "tests/test_production_readiness.py"
      - "tests/test_runtime_paths.py"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop,packaging]"

      - name: Windows-focused tests
        run: |
          python -m pytest tests/test_desktop.py tests/test_web_api.py tests/test_web_ui.py tests/test_production_readiness.py tests/test_runtime_paths.py

      - name: Build desktop bundle
        run: |
          pyinstaller packaging/windows/xray-desktop.spec --noconfirm --clean

      - name: Verify executable and checksum
        shell: pwsh
        run: |
          $exe = "dist/XRay-Texts-Forensics/XRay-Texts-Forensics.exe"
          if (-not (Test-Path $exe)) {
            throw "Desktop executable was not produced"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  XRay-Texts-Forensics.exe" | Set-Content "dist/XRay-Texts-Forensics/SHA256SUMS.txt"
          Get-Item $exe | Format-List Name,Length,FullName
          Get-Content "dist/XRay-Texts-Forensics/SHA256SUMS.txt"

      - name: Upload Windows alpha
        uses: actions/upload-artifact@v4
        with:
          name: XRay-Texts-Forensics-Windows-alpha
          path: dist/XRay-Texts-Forensics/
          if-no-files-found: error
